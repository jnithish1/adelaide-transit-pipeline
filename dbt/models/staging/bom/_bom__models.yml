version: 2

models:
  - name: stg_bom__observations
    description: >
      Bureau of Meteorology half-hourly observations, typed. Still contains
      duplicates because each landed file overlaps the previous one by ~48h.
    columns:
      - name: station_id
        description: WMO station number.
        data_tests: [not_null]
      - name: observed_at_local
        data_tests: [not_null]
      - name: air_temp_c
        data_tests:
          - dbt_utils.accepted_range:
              min_value: -10
              max_value: 55
              config:
                severity: warn
      - name: rain_since_9am_mm
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 300
              config:
                severity: warn
