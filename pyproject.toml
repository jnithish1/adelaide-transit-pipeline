[project]
name = "adelaide-transit-pipeline"
version = "1.0.0"
description = "Adelaide Metro GTFS + Open-Meteo weather -> S3 -> Snowflake -> dbt star schema, orchestrated with Airflow"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
